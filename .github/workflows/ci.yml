name: CI

# Corre en PRs hacia develop y main, y en los push directos a esas ramas (13.6).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Si se pushea de nuevo a la misma rama mientras el pipeline corre, se cancela el anterior:
# no tiene sentido gastar minutos validando un commit que ya quedó viejo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio para el GITHUB_TOKEN. Sin este bloque hereda los permisos por defecto del
# repositorio, que suelen incluir ESCRITURA: una dependencia comprometida en cualquiera de los
# pasos de npm tendría, gratis, un token capaz de pushear a este repo. Este pipeline solo lee
# el código, así que con `contents: read` alcanza.
permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest

    env:
      # El build necesita que las variables existan y sean válidas (serverEnv.ts las valida al
      # importarse), pero NO se conecta a la base: `next build` no ejecuta queries en este
      # proyecto. Por eso alcanzan valores dummy y el CI no necesita el secreto real de Neon —
      # una credencial menos expuesta en el pipeline.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: valor-dummy-solo-para-que-el-build-de-ci-valide-el-entorno
      # Fuerza el mismo comportamiento de resolución de peers que en local (ver .npmrc).
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El cliente de Prisma es código generado y está gitignoreado: sin este paso, el
      # type-check falla porque no existe @/generated/prisma.
      - name: Generar cliente de Prisma
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      # El hook de pre-commit ya formatea lo que se commitea, pero solo en la máquina de quien
      # tenga husky instalado: un commit desde la web de GitHub o con --no-verify se saltea el
      # hook y el formato se desincroniza sin que nadie se entere.
      - name: Formato
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Tests unitarios
        run: npm test

      - name: Build
        run: npm run build

  # Job aparte del de lint/tipos/unit: estos necesitan una base de datos real y tardan más. Si
  # el build se rompe, se ve enseguida sin esperar a que Postgres arranque.
  integracion:
    name: Tests de integración
    runs-on: ubuntu-latest

    # 12.2 propone un branch dedicado de Neon. Se usa un contenedor: el "reseteo antes de cada
    # corrida" sale gratis porque el servicio nace vacío en cada job, y no hace falta una
    # credencial de Neon en el pipeline. La versión sigue a la de producción (Neon corre 17.10)
    # y la imagen trae `unaccent`, del que dependen el índice full-text y `sin_acentos()`.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prop2
          POSTGRES_PASSWORD: prop2
          POSTGRES_DB: prop2_test
        ports:
          - 5433:5432
        # Sin esto los pasos arrancan contra un Postgres que todavía inicializa: el clásico
        # fallo intermitente que depende de lo cargado que esté el runner.
        options: >-
          --health-cmd "pg_isready -U prop2 -d prop2_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL_TEST: postgresql://prop2:prop2@localhost:5433/prop2_test
      AUTH_SECRET: valor-dummy-solo-para-que-el-build-de-ci-valide-el-entorno
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run db:generate

      # Solo migraciones y seed: el contenedor ya lo levantó `services`, así que el paso de
      # docker compose del script local acá no corresponde.
      - name: Preparar la base
        run: npx prisma migrate deploy && npx tsx prisma/seed.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
          DATABASE_URL_UNPOOLED: ${{ env.DATABASE_URL_TEST }}
          DB_DRIVER: pg

      - name: Tests de integración
        run: npm run test:integration

  # Job aparte y no un paso más del anterior: no depende de instalar nada y su resultado se lee
  # solo, sin bucear en el log de un job que hace otras cinco cosas.
  dependencias:
    name: Revisión de dependencias
    runs-on: ubuntu-latest
    # La action compara la rama contra su base: fuera de un PR no tiene con qué comparar.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Revisar dependencias nuevas
        uses: actions/dependency-review-action@v5
        with:
          # Falla solo con vulnerabilidades altas o críticas que ENTREN en este PR. Las que ya
          # están en el repo son deuda conocida (ver README) y no tienen por qué bloquear un
          # cambio que no las toca.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
