name: Lighthouse

# Se dispara con el deployment_status de Vercel y no con el pull_request, por un motivo
# concreto: medir rendimiento necesita la app CORRIENDO con datos reales, y el job de CI levanta
# el build contra un Postgres vacío. La única URL servible es la del preview deployment, y este
# evento es el que la trae ya lista (no hay que adivinar ni esperar).
on:
  deployment_status:

permissions:
  contents: read

jobs:
  medir:
    name: Core Web Vitals
    runs-on: ubuntu-latest
    # Solo cuando el deploy terminó bien. El evento se emite también en "pending" y "failure", y
    # correr Lighthouse contra una URL que todavía no responde da un 0 que no significa nada.
    if: github.event.deployment_status.state == 'success'

    steps:
      - uses: actions/checkout@v7

      # Los previews de este proyecto tienen Deployment Protection activada: sin credenciales, la
      # URL responde con la pantalla de login de Vercel. La primera corrida de este workflow lo
      # demostró midiendo `vercel.com/login` y reportando un SEO de 0.82 que no era el de la app.
      #
      # El bypass se pasa como cabecera. Si el secreto no está cargado el job se saltea con un
      # aviso en vez de fallar: un check en rojo que nadie puede arreglar desde el código se
      # termina ignorando, y con él se ignoran los que sí importan.
      # El secreto se llama LIGHTHOUSE porque es el nombre con el que está cargado en el repo,
      # pero conviene saber QUÉ es: el Protection Bypass for Automation de Vercel. No tiene nada
      # que ver con Lighthouse en sí — es una credencial que abre cualquier deployment protegido
      # de este proyecto, y sirve igual para, por ejemplo, correr los E2E contra un preview.
      - name: ¿Hay token para entrar al preview?
        id: bypass
        env:
          TOKEN: ${{ secrets.LIGHTHOUSE }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Falta el secreto LIGHTHOUSE (el Protection Bypass for Automation de Vercel). Se saltea la medición: sin ese token Lighthouse mide la pantalla de login de Vercel, no la app. Se saca de Vercel → Project Settings → Deployment Protection → Protection Bypass for Automation."
          else
            echo "hay=true" >> "$GITHUB_OUTPUT"
          fi

      # Las cabeceras se inyectan acá y no en el JSON versionado: el secreto no puede quedar
      # committeado, y el resto de la config (los umbrales) sí conviene que se lea en el repo.
      - name: Preparar la config con el bypass
        if: steps.bypass.outputs.hay == 'true'
        env:
          TOKEN: ${{ secrets.LIGHTHOUSE }}
        run: |
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(".github/lighthouse/config.json", "utf8"));
            config.ci.collect.settings.extraHeaders = JSON.stringify({
              "x-vercel-protection-bypass": process.env.TOKEN,
              "x-vercel-set-bypass-cookie": "true",
            });
            fs.writeFileSync("lighthouserc.json", JSON.stringify(config, null, 2));
          '

      # Umbrales en .github/lighthouse/config.json. Qué bloquea y qué no es deliberado:
      #
      #   error → CLS, accesibilidad y SEO. Son propiedades del CÓDIGO y deterministas: una
      #           imagen sin dimensiones, un contraste malo o un title faltante dan el mismo
      #           resultado en cualquier máquina. Si empeoran, es porque el cambio los empeoró.
      #
      #   warn  → LCP, TBT y el score de performance. Dependen de la red y de cuán cargado esté
      #           el runner compartido de GitHub. Hacerlos bloqueantes convierte el pipeline en
      #           una lotería, y un CI que falla por azar se termina ignorando — que es peor que
      #           no tenerlo.
      #
      # El objetivo declarado en 9.2 (LCP < 2.5s, CLS < 0.1) sigue siendo el mismo; lo que
      # cambia es quién decide, y para LCP la decisión la toma una persona mirando el número.
      - name: Medir home y listado
        if: steps.bypass.outputs.hay == 'true'
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.deployment_status.environment_url }}
            ${{ github.event.deployment_status.environment_url }}/publicaciones
          configPath: ./lighthouserc.json
          # Tres corridas y se toma la mediana: una sola medición en un runner compartido tiene
          # una varianza que hace que el mismo commit pase o falle según el humor de la máquina.
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
